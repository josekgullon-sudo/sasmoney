# Configuración de Nginx para SasMoney.
#
# Es un fichero APARTE: no toca nada de lo que ya tengas montado (Emby incluido).
#
#   1. Cópialo a /etc/nginx/sites-available/sasmoney
#   2. Cambia NOMBRE-DEL-SITIO por tu dominio, o por el nombre gratuito de nip.io
#      si no quieres comprar dominio:  sasmoney.LA-IP-DE-TU-SERVIDOR.nip.io
#   3. Actívalo y recárgalo:
#        sudo ln -s /etc/nginx/sites-available/sasmoney /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   4. Pon el candado (gratis y se renueva solo):
#        sudo certbot --nginx -d NOMBRE-DEL-SITIO
#
# El "nginx -t" del paso 3 comprueba la configuración ANTES de recargar: si algo
# estuviera mal, avisa y no recarga, así que lo que ya sirve no se cae.
#
# Cambia el 4400 si el instalador eligió otro puerto (míralo en
# /opt/sasmoney/sasmoney.env).

server {
    listen 80;
    listen [::]:80;
    server_name NOMBRE-DEL-SITIO;

    # Aquí nadie sube ficheros: así se corta cualquier envío desmedido.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
