# Ejemplo para Nginx, por si ya lo tienes montado para Emby.
# Guárdalo como /etc/nginx/sites-available/sasmoney y actívalo con:
#   sudo ln -s /etc/nginx/sites-available/sasmoney /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# El certificado lo pone certbot:
#   sudo certbot --nginx -d sasmoney.tudominio.com
#
# Esto NO toca la configuración que ya tengas para Emby: es un fichero aparte.

server {
    listen 80;
    listen [::]:80;
    server_name sasmoney.tudominio.com;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
